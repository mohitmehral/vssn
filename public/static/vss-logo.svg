<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vishwa Sanatan Sansthanam emblem">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="35%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6c343"/>
      <stop offset="55%" stop-color="#e08a1e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <path id="topArc" d="M 106 256 A 150 150 0 0 1 406 256" fill="none"/>
    <path id="botArc" d="M 121 256 A 135 135 0 0 0 391 256" fill="none"/>
  </defs>

  <!-- Laurel wreath: two symmetric sprigs of leaves -->
  <g>
    <!-- generate a wreath from mirrored leaf groups -->
    <g fill="url(#leaf)" stroke="#8a4b09" stroke-width="1">
      <!-- left sprig -->
      <g>
        <!-- 11 leaves along the left arc -->
        <g transform="rotate(-2 256 256)">
          <!-- leaves drawn via a repeated ellipse rotated around center at r~200 -->
        </g>
      </g>
    </g>

    <!-- Programmatic-looking wreath approximated with two arcs of leaf shapes -->
    <g fill="url(#leaf)" stroke="#8a4b09" stroke-width="1.2">
      <!-- LEFT side leaves -->
      <g>
        <ellipse cx="256" cy="66" rx="10" ry="20" transform="rotate(-8 256 256)"/>
        <ellipse cx="210" cy="72" rx="10" ry="20" transform="rotate(-30 256 256)"/>
        <ellipse cx="170" cy="92" rx="10" ry="20" transform="rotate(-50 256 256)"/>
        <ellipse cx="132" cy="126" rx="10" ry="20" transform="rotate(-72 256 256)"/>
        <ellipse cx="100" cy="168" rx="10" ry="20" transform="rotate(-96 256 256)"/>
        <ellipse cx="78" cy="216" rx="10" ry="20" transform="rotate(-120 256 256)"/>
        <ellipse cx="70" cy="266" rx="9" ry="18" transform="rotate(-146 256 256)"/>
        <ellipse cx="80" cy="312" rx="9" ry="17" transform="rotate(-170 256 256)"/>
        <ellipse cx="104" cy="352" rx="8" ry="16" transform="rotate(-192 256 256)"/>
        <ellipse cx="140" cy="388" rx="8" ry="15" transform="rotate(-212 256 256)"/>
      </g>
      <!-- RIGHT side leaves (mirror) -->
      <g transform="scale(-1,1) translate(-512,0)">
        <ellipse cx="256" cy="66" rx="10" ry="20" transform="rotate(-8 256 256)"/>
        <ellipse cx="210" cy="72" rx="10" ry="20" transform="rotate(-30 256 256)"/>
        <ellipse cx="170" cy="92" rx="10" ry="20" transform="rotate(-50 256 256)"/>
        <ellipse cx="132" cy="126" rx="10" ry="20" transform="rotate(-72 256 256)"/>
        <ellipse cx="100" cy="168" rx="10" ry="20" transform="rotate(-96 256 256)"/>
        <ellipse cx="78" cy="216" rx="10" ry="20" transform="rotate(-120 256 256)"/>
        <ellipse cx="70" cy="266" rx="9" ry="18" transform="rotate(-146 256 256)"/>
        <ellipse cx="80" cy="312" rx="9" ry="17" transform="rotate(-170 256 256)"/>
        <ellipse cx="104" cy="352" rx="8" ry="16" transform="rotate(-192 256 256)"/>
        <ellipse cx="140" cy="388" rx="8" ry="15" transform="rotate(-212 256 256)"/>
      </g>
    </g>
  </g>

  <!-- Dark outer ring bearing the names -->
  <circle cx="256" cy="256" r="150" fill="#2b0f0a"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#d4a017" stroke-width="3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#d4a017" stroke-width="2"/>

  <!-- Hindi name along top arc -->
  <text font-family="'Tiro Devanagari Hindi', serif" font-size="26" fill="#f6c343" font-weight="700" letter-spacing="1">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">विश्व सनातन संस्थानम्</textPath>
  </text>
  <!-- English name along bottom arc -->
  <text font-family="Arial, sans-serif" font-size="17" fill="#f6c343" font-weight="700" letter-spacing="3">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">VISHWA SANATANA SANSTHANAM</textPath>
  </text>

  <!-- Om (left) and Swastika (right) flanking the sun -->
  <text x="150" y="268" font-family="serif" font-size="34" fill="#f6c343" text-anchor="middle">ॐ</text>
  <text x="362" y="268" font-family="serif" font-size="30" fill="#f6c343" text-anchor="middle">卐</text>

  <!-- Radiant sun disc -->
  <circle cx="256" cy="256" r="86" fill="url(#sun)"/>
  <!-- sun rays -->
  <g stroke="#f59e0b" stroke-width="2" opacity="0.85">
    <!-- 36 rays -->
    <g id="rays"></g>
  </g>
  <g fill="#e8890b">
    <!-- draw triangular rays around the disc -->
  </g>
  <g stroke="#c2410c" stroke-width="1.4" opacity="0.7">
    <line x1="256" y1="176" x2="256" y2="196"/>
    <line x1="256" y1="316" x2="256" y2="336"/>
    <line x1="176" y1="256" x2="196" y2="256"/>
    <line x1="316" y1="256" x2="336" y2="256"/>
    <line x1="199" y1="199" x2="213" y2="213"/>
    <line x1="299" y1="299" x2="313" y2="313"/>
    <line x1="313" y1="199" x2="299" y2="213"/>
    <line x1="213" y1="299" x2="199" y2="313"/>
  </g>

  <!-- Saffron flag on a pole at the sun's centre -->
  <g>
    <line x1="248" y1="212" x2="248" y2="300" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
    <path d="M248 216 L296 230 L248 244 Z" fill="#ea580c" stroke="#b45309" stroke-width="1"/>
  </g>
</svg>
